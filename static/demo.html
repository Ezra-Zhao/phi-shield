<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PHI-Shield Demo</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 960px; padding: 0 1rem; }
  textarea { width: 100%; height: 180px; font-family: ui-monospace, monospace; }
  .row { display: flex; gap: 1rem; }
  .pane { flex: 1; }
  pre { background: #f4f4f5; padding: 1rem; white-space: pre-wrap; word-break: break-word; min-height: 120px; }
  .chip { display: inline-block; background: #e0e7ff; border-radius: 999px; padding: 0.1rem 0.6rem; margin: 0.15rem; font-size: 0.85rem; }
  button { padding: 0.5rem 1.2rem; font-size: 1rem; cursor: pointer; }
  select { padding: 0.4rem; font-size: 1rem; }
  .note { color: #666; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>PHI-Shield &mdash; clinical text de-identification</h1>
<p class="note">Demo only. Paste <strong>synthetic</strong> text; do not paste real patient data.</p>

<label for="mode">Mode:</label>
<select id="mode">
  <option value="label">label &mdash; replace with [TYPE]</option>
  <option value="mask">mask &mdash; replace with ***</option>
  <option value="safe_harbor">safe_harbor &mdash; dates to year, ZIP to 3 digits, ages &gt;89 to 90</option>
</select>
<button id="run">De-identify</button>

<div class="row">
  <div class="pane">
    <h3>Before</h3>
    <textarea id="input">DISCHARGE SUMMARY
Patient: John A. Smith
DOB: 03/14/1958
MRN: 8473625
Attending: Dr. Maria Garcia
Address: 482 Maple Avenue, San Jose, CA 95129
Phone: (408) 555-0134
Fax: 408-555-0176
The patient is a 92-year-old who presented with hypertension.
Follow-up on March 2, 2026. Mr. Smith tolerated the procedure well.</textarea>
  </div>
  <div class="pane">
    <h3>After</h3>
    <pre id="output">(result will appear here)</pre>
  </div>
</div>

<h3>Detected entities</h3>
<div id="entities"></div>

<script>
document.getElementById('run').addEventListener('click', async () => {
  const text = document.getElementById('input').value;
  const mode = document.getElementById('mode').value;
  const res = await fetch('/deidentify', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text, mode})
  });
  const data = await res.json();
  document.getElementById('output').textContent = data.deidentified_text || JSON.stringify(data);
  const box = document.getElementById('entities');
  box.innerHTML = '';
  (data.entities || []).forEach(e => {
    const s = document.createElement('span');
    s.className = 'chip';
    s.textContent = e.entity_type + ': "' + e.text + '" (' + e.score + ')';
    box.appendChild(s);
  });
});
</script>
</body>
</html>
